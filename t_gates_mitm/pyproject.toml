[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "t-gates-mitm"
version = "0.1.0"
description = "Minimal meet-in-the-middle T-count search for BlueQubit integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tgates_mitm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
